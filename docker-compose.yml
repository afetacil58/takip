services:
  app:
    build: .
    container_name: afad
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the .env file}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      BASE_URL: ${BASE_URL:-http://127.0.0.1:5000}
    ports:
      - 5000
    volumes:
      - type: bind
        source: ./gorev_takip.db
        target: /app/gorev_takip.db
        bind:
          create_host_path: false
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
      - ./email_config.py:/app/email_config.py:ro
